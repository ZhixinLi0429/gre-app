<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>GRE 刷题</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--fs:16px;--blue:#5e35b1;--soft:#ede7f6;--line:#e6e8eb;--ok:#2e7d32;--bad:#c62828}
html,body{overscroll-behavior-y:contain}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#111}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
/* ---- home ---- */
.top{position:sticky;top:0;z-index:100;background:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 var(--line)}
.tab-bar{display:flex}
.tab-btn{flex:1;padding:12px 4px 10px;border:none;background:none;font-size:15px;font-weight:500;color:#555;border-bottom:3px solid transparent}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.subbar{display:flex;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.seg{display:flex;flex:0 0 auto;border:1px solid #d0d7de;border-radius:16px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid #d0d7de}
.seg button.on{background:var(--blue);color:#fff}
.home{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
.sec-h{font-size:13px;font-weight:600;color:#666;margin:16px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h small{font-weight:400;color:#999}
.today{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.today-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.today-h b{font-size:15px}
.today-h span{font-size:12px;color:#888}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid #d1c4e9;background:#fff;border-radius:16px;padding:5px 11px;font-size:13px}
.tchip.done{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
.tchip.part{background:#fff8e1;border-color:#ffe082}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{background:#fff;border:1px solid #e3e3e8;border-radius:10px;padding:10px 8px 8px;text-align:left;position:relative;min-height:66px}
.tile b{display:block;font-size:14px}
.tile small{display:block;font-size:12px;color:#888;margin-top:2px}
.tile .bar{position:absolute;left:8px;right:8px;bottom:7px;height:4px;border-radius:2px;background:#eee;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--blue)}
.tile.done{border-color:#a5d6a7}
.tile.done .bar i{background:var(--ok)}
.tile.today{box-shadow:0 0 0 2px var(--blue) inset}
.rowbtns{display:flex;gap:8px;margin-top:4px}
.bigbtn{flex:1;border:1px solid #e3e3e8;background:#fff;border-radius:10px;padding:12px;text-align:left}
.bigbtn b{display:block}
.bigbtn small{color:#888}
/* ---- practice ---- */
.prac{position:fixed;inset:0;background:#f5f5f7;z-index:200;display:flex;flex-direction:column}
.p-top{background:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 0 var(--line)}
.p-top .back{border:none;background:none;font-size:22px;width:38px;height:38px}
.p-top .t{flex:1;min-width:0}
.p-top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top .t small{font-size:12px;color:#888}
.p-top .star{font-size:23px}
.prog{height:3px;background:#eee}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.p-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 20px;font-size:var(--fs)}
.p-body>*{max-width:760px;margin-left:auto;margin-right:auto}
.p-foot{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.p-foot button{border:none;border-radius:22px;padding:11px 0;font-size:15px}
.p-foot .nav{flex:0 0 26%;background:#eceff1;color:#455a64}
.p-foot .nav:disabled{opacity:.35}
.p-foot .main{flex:1;background:var(--blue);color:#fff}
.p-foot .main:disabled{background:#b39ddb}
.star{border:none;background:none;font-size:21px;color:#c2c2c2;padding:0 2px;line-height:1}
.star.on{color:#f5a623}
.qmeta{font-size:12px;color:#888;margin-bottom:6px}
.stem{line-height:1.65}
.stem img,.opt img,.why img,.passage img{max-width:100%;height:auto;display:block;margin:6px auto}
.stem svg,.opt svg,.why svg{max-width:100%}
.mathwrap{overflow-x:auto}
.zh{color:#444;font-size:.92em;line-height:1.65}
.passage{line-height:1.75;background:#fff;border:1px solid #e6e6ea;border-radius:8px;padding:10px 12px;margin-bottom:10px;max-height:42vh;overflow-y:auto}
.passage.full{max-height:none}
.passage p{margin:0 0 8px}
.passage strong{background:#fff3a3;font-weight:600}
.reading-sentence{background:#d1c4e9}
.ptools{display:flex;gap:6px;margin:-4px 0 10px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.qa>div{border:1px solid #e0e0e0;border-radius:8px;padding:8px;text-align:center;background:#fff;overflow-x:auto}
.qa .lab{font-size:12px;color:#888;margin-bottom:4px}
.group-t{font-size:12px;color:#888;margin:12px 0 2px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1.5px solid #e0e0e0;border-radius:10px;padding:11px 12px;background:#fff;text-align:left;line-height:1.5;display:flex;gap:10px;align-items:flex-start;min-height:48px}
.opt .l{font-weight:600;color:#888;flex-shrink:0;min-width:16px}
.opt .c{min-width:0;flex:1;overflow-x:auto}
.opt .cn{display:block;font-size:.85em;color:#666}
.opt.sel{border-color:var(--blue);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:#e8f5e9}
.opt.bad{border-color:var(--bad);background:#ffebee}
.fill-row{display:flex;align-items:center;gap:6px;margin-top:14px}
.fill-row input{border:1.5px solid #c5cae9;border-radius:8px;padding:10px 12px;flex:1;max-width:220px;font-size:17px}
.fill-row input.ok{border-color:var(--ok);background:#e8f5e9}.fill-row input.bad{border-color:var(--bad);background:#ffebee}
.verdict{margin-top:12px;font-weight:600;font-size:15px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.why{background:#f6f8e8;border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.65;font-size:.93em;white-space:pre-wrap}
.why.html{white-space:normal}
.why p{margin:0 0 6px}
.mini{border:1px solid #cfd8dc;background:#fff;color:#455a64;border-radius:14px;padding:4px 11px;font-size:12px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;border:1px solid #d1c4e9;background:#fff;border-radius:14px;padding:1px 4px 1px 2px;font-size:13px}
.chip .star{font-size:17px}
.chip .wl{border:none;background:none;padding:3px 5px;color:#4527a0}
.chip.known .wl{color:#9e9e9e;text-decoration:line-through}
.label-s{font-size:12px;color:#888;margin-top:12px}
.drill-stem{font-size:1.7em;font-weight:600;margin:18px 0 6px;text-align:center}
.drill-actions{display:flex;gap:8px;margin-top:12px}
.drill-actions button{flex:1;border:1px solid #ffcc80;background:#fff3e0;color:#e65100;border-radius:10px;padding:10px}
.kbtn{border:1px solid #cfd8dc;background:#fff;border-radius:14px;padding:4px 11px;font-size:13px}
.kbtn.on{background:#455a64;border-color:#455a64;color:#fff}
/* summary */
.sum{text-align:center;padding-top:20px}
.sum .score{font-size:44px;font-weight:700;color:var(--blue)}
.sum .sub{color:#666;margin-bottom:14px}
.wrongs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 18px}
.wrongs button{border:1px solid #ef9a9a;background:#ffebee;color:#b71c1c;border-radius:8px;width:44px;height:38px}
.sum .acts{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.sum .acts button{border:none;border-radius:22px;padding:12px;font-size:15px;background:#eceff1;color:#455a64}
.sum .acts button.primary{background:var(--blue);color:#fff}
/* words */
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:8px;margin-bottom:8px}
.toolbar select,.toolbar input{border:1px solid #d0d7de;border-radius:16px;background:#fff;padding:6px 12px;font-size:13px}
.toolbar input{flex:1;min-width:0}
.word-row{display:flex;align-items:center;gap:8px;border-top:1px solid #f0f0f0;padding:10px 0}
.word-row:first-child{border-top:none}
.word-row .w{font-weight:600}
.word-row .m{flex:1;min-width:0;color:#444;font-size:.92em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word-row.known .w{color:#9e9e9e;text-decoration:line-through}
.meta{font-size:12px;color:#888;margin:0 2px 8px;display:flex;justify-content:space-between}
.more{display:block;margin:4px auto 16px;border:1px solid #d0d7de;background:#fff;border-radius:18px;padding:8px 20px;font-size:14px}
.md h3{font-size:1.15em;margin:4px 0 6px}
.md h4{font-size:.95em;color:var(--blue);margin:10px 0 3px}
.md p{margin:0 0 6px;line-height:1.6}
.md ol,.md ul{margin:0 0 6px;padding-left:20px;line-height:1.6}
.flash{min-height:46vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;user-select:none;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px}
.flash .big{font-size:2.1em;font-weight:600}
.flash .hint{font-size:12px;color:#999;margin-top:14px}
.empty,.loading{text-align:center;color:#888;padding:40px 0}
.gear{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:18px;z-index:150}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:350}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:#f5f5f7;border-radius:14px 14px 0 0;z-index:360;padding:0 12px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;background:#f5f5f7;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px 8px}
.sheet-head .x{border:none;background:#e0e0e0;border-radius:50%;width:30px;height:30px;flex-shrink:0}
.set{background:#fff;border-radius:10px;padding:4px 14px;margin-bottom:12px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:15px}
.set-row:last-child{border-bottom:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:400}
.lightbox img{max-width:96vw;max-height:86vh;background:#fff;border-radius:6px}
</style>
</head>

function numeric(raw) {

function highlightSentence(passage, a, text) {
  passage.innerHTML = a.html;
  const pattern = String(text || '').trim().split(/\s+/).map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s+');
  if (!pattern) return;

}

}
function wordStar(id) {

async function wordChips(ids, holder) {

  if (!list.length) return;

    el('span', { class: 'chip' + (W(w.id).known ? ' known' : '') }, [wordStar(w.id), el('button', { class: 'wl', text: w.en, onclick: () => wordSheet(w.id) })]))));
}
function md(text) {
  const box = el('div', { class: 'md' });
  let list = null;
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
    let m;
    if (!line.trim()) { list = null; return; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { list = null; box.append(el(m[1].length <= 3 ? 'h3' : 'h4', { html: inline(m[2]) })); return; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { list = null; return; }
    if ((m = line.match(/^\s*(\d+\.|[-*])\s+(.*)$/))) { if (!list) { list = el(/\d/.test(m[1]) ? 'ol' : 'ul'); box.append(list); } list.append(el('li', { html: inline(m[2]) })); return; }
    if (list && /^\s{2,}/.test(line)) { list.lastChild.append(el('div', { class: 'zh', html: inline(line.trim()) })); return; }
    list = null; box.append(el('p', { html: inline(line) }));

}
let sheetOpen = null, ignorePop = false;
